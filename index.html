<!DOCTYPE html>
<html>

<head>
    <title>noᴋove</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="resource/nk.svg">
    <link rel="icon" type="image/png" href="resource/nk.png">
</head>
<body>
    <div class="content">
        <img src="resource/nokove.svg" alt="noᴋove" style="margin: 10px;" draggable="false" onclick="usercolor =-1;">
        <div class="chatbox">
            <div class="fadeout"></div>
            <div class="messages">
                <div class="message frosty">
                <center><b>Welcome to Nokove! This is still in alpha, so lots of things might change! Connecting may take up to 15 seconds.</b></center>
                </div>
            </div>
            <div class="talkbox">
                <input type="text" placeholder="Try sending a blank message...">
                <button class="button"><img src="resource/send.svg" style="margin-left: auto; max-width: 30px;" onclick="send();"></button>
            </div>
            <div class="colorpanel">
	            <div class="slider hue"><span class="l"></span><span class="r"></span><input type="range" min="0" max="360" value="180"></div>
	            <div class="slider sat"><span class="l"></span><span class="r"></span><input type="range" min="0" max="100" value="50"></div>
	            <div class="slider val"><span class="l"></span><span class="r"></span><input type="range" min="0" max="100" value="65"></div>
</div>
        </div>
    </div>

    
    
    <script src="app.js"></script>
</body>



</html>
