<!DOCTYPE html>
<html>

<head>
    <title>noᴋove</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="/resource/nk.svg">
    <link rel="icon" type="image/png" href="/resource/nk.png">
</head>
<body>
    <div class="content">
        <img src="/resource/nokove.svg" alt="noᴋove" style="margin: 30px;" draggable="false">
        <div class="chatbox">
            <div class="fadeout"></div>
            <div class="messages">
                <div class="message frosty">
                <center>Welcome to Nokove! This is still in alpha, so lots of things might change! Connecting may take up to 15 seconds.</center>
                </div>
            </div>
            <div class="talkbox">
                <input type="text" placeholder="Say whatever...">
                <button class="button"><img src="/resource/send.svg" style="margin-left: auto; max-width: 30px;" onclick="send();"></button>
            </div>
        </div>
    </div>

    
    
    <script src="app.js"></script>
</body>



</html>
